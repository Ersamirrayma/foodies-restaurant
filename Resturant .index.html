<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie's Restaurant</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* NAVBAR */
nav {
  position: fixed;
  width: 100%;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 12px;
  text-align: center;
  z-index: 1000;
}

/* HERO */
header {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') no-repeat center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
}

header h1 {
  font-size: 3rem;
}

.btn {
  background: red;
  color: white;
  padding: 10px 20px;
  text-decoration: none;
  margin-top: 15px;
  display: inline-block;
  border-radius: 5px;
  transition: 0.3s;
}

.btn:hover {
  background: darkred;
  transform: scale(1.1);
}

/* SECTION */
.section {
  padding: 50px 20px;
  text-align: center;
}

/* MENU */
.menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}

.card {
  width: 250px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.card h3 {
  margin: 10px 0;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 10px;
}

.gallery img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: 0.4s;
}

.gallery img:hover {
  transform: scale(1.1);
}

/* FOOTER */
footer {
  background: #222;
  color: white;
  padding: 15px;
}

</style>
</head>

<body>

<nav>Foodie's Restaurant</nav>

<header>
  <div>
    <h1>Delicious Food Awaits</h1>
    <p>Order Now & Enjoy Taste</p>
    <a href="https://wa.me/919999999999" class="btn">Order on WhatsApp</a>
  </div>
</header>

<section class="section">
  <h2>Our Menu</h2>
  <div class="menu">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
      <h3>Pizza</h3>
      <p>Starting ₹199</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
      <h3>Burger</h3>
      <p>Starting ₹99</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1585032226651-759b368d7246?q=80&w=692">
      <h3>Chinese</h3>
      <p>Starting ₹149</p>
    </div>

  </div>
</section>

<section class="section">
  <h2>Gallery</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
    <img src="https://plus.unsplash.com/premium_photo-1694670234085-4f38b261ce5b?">
    <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
  </div>
</section>

<section class="section">
  <h2>Contact</h2>
  <p>Call / WhatsApp: +91 99999 99999</p>
  <p>Location: Bhuj </p>
</section>

<footer>
  <p>© 2026 Foodie's Restaurant</p>
</footer>

</body>
</html>
